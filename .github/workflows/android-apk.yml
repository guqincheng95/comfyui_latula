name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Keep this test line's debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: latula-debug-keystore-v1
      - name: Install and verify
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Create Android project
        working-directory: frontend
        run: npx cap add android
      - name: Configure test build
        working-directory: frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          text = text.replace('@mipmap/ic_launcher_round', '@drawable/latula_launcher').replace('@mipmap/ic_launcher', '@drawable/latula_launcher')
          p.write_text(text)
          import shutil
          shutil.copyfile("native/latula_launcher.xml", "android/app/src/main/res/drawable/latula_launcher.xml")
          shutil.copyfile("native/latula_styles.xml", "android/app/src/main/res/values/styles.xml")
          p = Path("android/app/build.gradle")
          text = p.read_text().replace("versionCode 1", "versionCode 301").replace('versionName "1.0"', 'versionName "0.01"')
          p.write_text(text)
          PY
      - name: Sync native plugins
        working-directory: frontend
        run: npx cap sync android
      - name: Build test APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug
      - name: Package
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/latula-v0.01-test.apk
          sha256sum output/latula-v0.01-test.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: latula-v0.01-test
          path: output/*
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: latula-v0.01-test
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and exercise the actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: python frontend/tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latula-android-checks
          path: output/android-checks/
          if-no-files-found: ignore
