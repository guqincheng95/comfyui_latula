name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/android_signing.py', 'scripts/configure_android.py', '.github/signing/identity.json', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.sign.outputs.ready }}
      artifact: ${{ steps.version.outputs.artifact }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - name: Require persistent signing configuration
        id: configured
        env:
          SIGNING_JSON: ${{ secrets.LATULA_ANDROID_SIGNING }}
        run: |
          if [ -n "$SIGNING_JSON" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### Android 签名配置待完成' >> "$GITHUB_STEP_SUMMARY"
            echo '请添加仓库 Secret LATULA_ANDROID_SIGNING。没有固定签名时不生成 APK，不回退到临时或缓存签名。参见 docs/ANDROID_SIGNING.md。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read maintained version
        id: version
        if: steps.configured.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os
          with open('frontend/version.json') as f:v=json.load(f)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('artifact=latula-v'+v['name']+'-test\n')
              f.write('apk=latula-v'+v['name']+'-test.apk\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        if: steps.configured.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Restore and verify the pinned signing identity
        if: steps.configured.outputs.ready == 'true'
        env:
          LATULA_ANDROID_SIGNING: ${{ secrets.LATULA_ANDROID_SIGNING }}
        run: |
          pip install cryptography
          python scripts/android_signing.py restore --directory "$RUNNER_TEMP/latula-signing"
      - name: Install, verify and build
        if: steps.configured.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          python tests/protocol-server.py > /tmp/latula-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          node tests/ui-check.mjs
          kill "$FIXTURE_PID"
          trap - EXIT
          npx cap add android
          python ../scripts/configure_android.py
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - name: Sign with the fixed certificate and verify Android versions
        id: sign
        if: steps.configured.outputs.ready == 'true'
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          python scripts/android_signing.py sign --directory "$RUNNER_TEMP/latula-signing" \
            --apksigner "$APK_SIGNER" \
            --apk frontend/android/app/build/outputs/apk/debug/app-debug.apk \
            --output "output/$APK_NAME"
          cp .github/signing/latula-release-v1.pem .github/signing/identity.json output/
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: output/*
          retention-days: 30
      - name: Remove private signing working files
        if: always()
        run: rm -rf "$RUNNER_TEMP/latula-signing"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latula-build-ui-checks
          path: frontend/test-results/
          if-no-files-found: ignore
  android-smoke:
    needs: build-apk
    if: needs.build-apk.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact }}
          path: output
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the signed APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_APK_PATH: ${{ github.workspace }}/output/${{ needs.build-apk.outputs.apk }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-animations: true
          script: python frontend/tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latula-android-checks
          path: output/android-checks/
          if-no-files-found: ignore
  publish:
    needs: [build-apk, android-smoke]
    if: github.ref == 'refs/heads/main' && needs.android-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      APK_NAME: ${{ needs.build-apk.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.artifact }}
          path: output
      - name: Publish the signed and emulator-verified test APK
        run: |
          sha256sum -c output/SHA256SUMS.txt
          VERSION=$(python -c "import json; print(json.load(open('frontend/version.json'))['name'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/latula-existing
            gh release download "$TAG" --pattern "$APK_NAME" --dir /tmp/latula-existing
            cmp "output/$APK_NAME" "/tmp/latula-existing/$APK_NAME"
          else
            gh release create "$TAG" output/* --target "$SOURCE_SHA" \
              --title "拉图 $VERSION · 通用装配测试版" --prerelease \
              --notes-file "docs/RELEASE_NOTES_$VERSION.md"
          fi
